<div class="mx-auto grid max-w-7xl gap-10 px-6 py-16 sm:px-8 sm:py-20 lg:grid-cols-[0.8fr_1.2fr] lg:gap-16">
    <div>
        <p class="text-sm font-semibold uppercase text-blue-700">Estamos para atenderte</p>
        <h2 class="mt-2 text-3xl font-bold text-slate-950 sm:text-4xl">Contáctanos</h2>
        <p class="mt-4 max-w-md text-base leading-7 text-slate-600">Escríbenos para consultar sobre nuestros programas y servicios institucionales.</p>
        <a class="mt-6 inline-flex items-center gap-2 font-semibold text-blue-700 hover:text-blue-900" href="mailto:contactos@iestphuanta.edu.pe">
            <i class="fa-solid fa-envelope" aria-hidden="true"></i>
            contactos@iestphuanta.edu.pe
        </a>
    </div>

    <form class="grid gap-5 sm:grid-cols-2">
        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-800" for="contacto-nombre">Nombre</label>
            <input class="min-h-12 w-full border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-colors focus:border-blue-700 focus:ring-2 focus:ring-blue-100" id="contacto-nombre" type="text" placeholder="Tu nombre">
        </div>

        <div>
            <label class="mb-2 block text-sm font-semibold text-slate-800" for="contacto-correo">Correo electrónico</label>
            <input class="min-h-12 w-full border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-colors focus:border-blue-700 focus:ring-2 focus:ring-blue-100" id="contacto-correo" type="email" placeholder="nombre@correo.com">
        </div>

        <div class="sm:col-span-2">
            <label class="mb-2 block text-sm font-semibold text-slate-800" for="contacto-mensaje">Mensaje</label>
            <textarea class="min-h-36 w-full border border-slate-300 bg-white px-4 py-3 text-slate-900 outline-none transition-colors focus:border-blue-700 focus:ring-2 focus:ring-blue-100" id="contacto-mensaje" placeholder="¿En qué podemos ayudarte?"></textarea>
        </div>

        <div class="sm:col-span-2">
            <button class="inline-flex min-h-12 items-center justify-center bg-blue-700 px-6 py-3 text-sm font-semibold text-white transition-colors hover:bg-blue-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-700" type="submit">
                Enviar mensaje
            </button>
        </div>
    </form>
</div>
